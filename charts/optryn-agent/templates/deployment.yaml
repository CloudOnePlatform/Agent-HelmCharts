apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "optryn-agent.fullname" . }}
  labels:
    {{- include "optryn-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "optryn-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "optryn-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "optryn-agent.fullname" . }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: OPTRYN_API_BASE_URL
              value: {{ .Values.apiBaseUrl | quote }}
            - name: OPTRYN_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            - name: OPTRYN_AGENT_TOKEN
              value: {{ .Values.agentToken | quote }}
            - name: OPTRYN_PROMETHEUS_URL
              value: "http://{{ include "optryn-agent.fullname" . }}-prometheus-server"
            - name: OPTRYN_SCRAPE_INTERVAL_SECONDS
              value: "60"
            - name: OPTRYN_LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10

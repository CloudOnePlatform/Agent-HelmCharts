{{- /*
The agent token is a credential: it lets the holder push metrics as this
cluster. It was a plain env value, readable by anyone who can read the
Deployment; it now lives in a Secret (QA-059). Set existingSecret to use a
Secret you manage (key: agentToken) instead.
*/ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "optryn-agent.fullname" . }}-token
  labels:
    {{- include "optryn-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  agentToken: {{ required "agentToken is required (or set existingSecret)" .Values.agentToken | quote }}
{{- end }}
